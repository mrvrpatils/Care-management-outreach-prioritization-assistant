<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Clinical Portal - Sign In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00685f",
                        "primary-hover": "#00534c",
                        "primary-container": "#008378",
                        "on-primary": "#ffffff",
                        "secondary": "#006591",
                        "secondary-container": "#39b8fd",
                        "background": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "surface-container": "#e5eeff",
                        "surface-container-low": "#eff4ff",
                        "surface-container-high": "#dce9ff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#0b1c30",
                        "on-surface-variant": "#3d4947",
                        "outline": "#6d7a77",
                        "outline-variant": "#bcc9c6",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    }
                }
            }
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f7f6 0%, #e5eeff 50%, #f8f9ff 100%);
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(188, 201, 198, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 104, 95, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.02);
        }
        .tab-btn.active {
            color: #00685f;
            border-bottom: 2px solid #00685f;
            font-weight: 600;
        }
        .tab-btn:not(.active) {
            color: #6d7a77;
            border-bottom: 2px solid transparent;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen">

    <!-- Auth Container -->
    <div class="w-full max-w-md my-8">
        
        <!-- Brand Header -->
        <div class="flex flex-col items-center text-center mb-6">
            <div class="flex items-center justify-center w-14 h-14 rounded-2xl bg-white shadow-md border border-[#bcc9c6]/30 mb-3 p-2 transition-transform hover:scale-105">
                <img src="/static/brand-mark.svg" alt="Portal Logo" class="w-10 h-10 object-contain"/>
            </div>
            <h1 class="text-xl font-bold text-[#0b1c30] tracking-tight">Clinical Outreach Portal</h1>
            <p class="text-xs text-outline mt-1 max-w-xs">Please sign in to access your workspace</p>
        </div>

        <!-- Card Body -->
        <div class="glass-card rounded-2xl p-6 sm:p-8">
            
            <!-- Tab Switcher -->
            <div class="flex border-b border-outline-variant/40 mb-6">
                <button type="button" id="tabSignIn" class="tab-btn active flex-1 pb-3 text-sm text-center transition-colors">
                    Sign In
                </button>
                <button type="button" id="tabRegister" class="tab-btn flex-1 pb-3 text-sm text-center transition-colors">
                    Create Account
                </button>
            </div>

            <!-- Global Alert Container -->
            <div id="alertBox" class="hidden mb-5 p-3.5 rounded-xl text-sm flex items-start gap-2.5">
                <span id="alertIcon" class="material-symbols-outlined text-lg shrink-0 mt-0.5"></span>
                <span id="alertMsg" class="font-medium text-xs leading-relaxed"></span>
            </div>

            <!-- 1. SIGN IN FORM -->
            <form id="signInForm" class="space-y-4" onsubmit="handleSignIn(event)">
                <div>
                    <label for="loginUsername" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider mb-1.5">
                        Username or Email
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">person</span>
                        </div>
                        <input
                            type="text"
                            id="loginUsername"
                            required
                            autocomplete="username"
                            placeholder="e.g. admin or elena.care"
                            class="block w-full pl-10 pr-3 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder:text-gray-400 transition"
                        />
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="loginPassword" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider">
                            Password
                        </label>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">lock</span>
                        </div>
                        <input
                            type="password"
                            id="loginPassword"
                            required
                            autocomplete="current-password"
                            placeholder="••••••••"
                            class="block w-full pl-10 pr-10 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder:text-gray-400 transition"
                        />
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-outline hover:text-on-surface focus:outline-none"
                            aria-label="Toggle password visibility"
                        >
                            <span id="loginEyeIcon" class="material-symbols-outlined text-lg">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe" checked class="w-4 h-4 rounded text-primary focus:ring-primary border-outline-variant"/>
                        <span class="text-xs text-on-surface-variant font-medium">Keep me signed in</span>
                    </label>
                </div>

                <button
                    type="submit"
                    id="signInSubmitBtn"
                    class="w-full mt-2 py-3 px-4 rounded-xl bg-primary hover:bg-primary-hover text-white text-sm font-semibold shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2"
                >
                    <span id="signInBtnText">Sign In to Dashboard</span>
                    <span id="signInSpinner" class="hidden animate-spin material-symbols-outlined text-base">progress_activity</span>
                </button>
            </form>

            <!-- 2. CREATE ACCOUNT (REGISTER) FORM -->
            <form id="registerForm" class="space-y-3.5 hidden" onsubmit="handleRegister(event)">
                <div>
                    <label for="regFullName" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider mb-1">
                        Full Name
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">badge</span>
                        </div>
                        <input
                            type="text"
                            id="regFullName"
                            required
                            placeholder="e.g. Dr. Sarah Mitchell"
                            class="block w-full pl-10 pr-3 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder:text-gray-400 transition"
                        />
                    </div>
                </div>

                <div>
                    <label for="regUsername" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider mb-1">
                        Username
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">alternate_email</span>
                        </div>
                        <input
                            type="text"
                            id="regUsername"
                            required
                            minlength="3"
                            placeholder="e.g. sarah.mitchell"
                            class="block w-full pl-10 pr-3 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder:text-gray-400 transition"
                        />
                    </div>
                </div>

                <div>
                    <label for="regEmail" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider mb-1">
                        Email Address (Optional)
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">mail</span>
                        </div>
                        <input
                            type="email"
                            id="regEmail"
                            placeholder="sarah@healthsystem.org"
                            class="block w-full pl-10 pr-3 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder:text-gray-400 transition"
                        />
                    </div>
                </div>

                <div>
                    <label for="regRole" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider mb-1">
                        Clinical Role
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">stethoscope</span>
                        </div>
                        <select
                            id="regRole"
                            class="block w-full pl-10 pr-8 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface transition"
                        >
                            <option value="Care Manager">Care Manager</option>
                            <option value="Lead Clinician">Lead Clinician</option>
                            <option value="Health Coach">Health Coach / Nurse</option>
                            <option value="Population Health Specialist">Population Health Specialist</option>
                            <option value="Administrator">Administrator</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="regPassword" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider mb-1">
                        Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">lock</span>
                        </div>
                        <input
                            type="password"
                            id="regPassword"
                            required
                            minlength="4"
                            placeholder="At least 4 characters"
                            class="block w-full pl-10 pr-10 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder:text-gray-400 transition"
                        />
                        <button
                            type="button"
                            onclick="togglePasswordVisibility('regPassword', 'regEyeIcon')"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-outline hover:text-on-surface focus:outline-none"
                            aria-label="Toggle password visibility"
                        >
                            <span id="regEyeIcon" class="material-symbols-outlined text-lg">visibility</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="regConfirmPassword" class="block text-xs font-semibold text-[#0b1c30] uppercase tracking-wider mb-1">
                        Confirm Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-lg">lock_reset</span>
                        </div>
                        <input
                            type="password"
                            id="regConfirmPassword"
                            required
                            minlength="4"
                            placeholder="Re-enter password"
                            class="block w-full pl-10 pr-3 py-2.5 text-sm bg-white border border-outline-variant/60 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary text-on-surface placeholder:text-gray-400 transition"
                        />
                    </div>
                </div>

                <button
                    type="submit"
                    id="registerSubmitBtn"
                    class="w-full mt-3 py-3 px-4 rounded-xl bg-primary hover:bg-primary-hover text-white text-sm font-semibold shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2"
                >
                    <span id="regBtnText">Create Account</span>
                    <span id="regSpinner" class="hidden animate-spin material-symbols-outlined text-base">progress_activity</span>
                </button>
            </form>
        </div>

        <!-- Footer Notice -->
        <p class="text-center text-xs text-outline mt-6">
            Secure HIPAA-compliant Care Outreach Assistant &bull; Version 1.0.0
        </p>
    </div>

    <!-- Script Logic -->
    <script>
        // Check if user is already authenticated
        (function checkAlreadyLoggedIn() {
            const token = localStorage.getItem('carewise_token');
            const userStr = localStorage.getItem('carewise_user');
            if (token && userStr) {
                // If already logged in, redirect straight to dashboard
                window.location.replace('/');
            }
        })();

        // Tab Switching
        const tabSignIn = document.getElementById('tabSignIn');
        const tabRegister = document.getElementById('tabRegister');
        const signInForm = document.getElementById('signInForm');
        const registerForm = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');

        tabSignIn.addEventListener('click', () => {
            tabSignIn.classList.add('active');
            tabRegister.classList.remove('active');
            signInForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            hideAlert();
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabSignIn.classList.remove('active');
            registerForm.classList.remove('hidden');
            signInForm.classList.add('hidden');
            hideAlert();
        });

        function showAlert(msg, isSuccess = false) {
            alertBox.className = isSuccess
                ? 'mb-5 p-3.5 rounded-xl text-sm flex items-start gap-2.5 bg-emerald-50 text-emerald-800 border border-emerald-200'
                : 'mb-5 p-3.5 rounded-xl text-sm flex items-start gap-2.5 bg-error-container text-on-error-container border border-error/20';
            document.getElementById('alertIcon').textContent = isSuccess ? 'check_circle' : 'error';
            document.getElementById('alertMsg').textContent = msg;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        async function handleSignIn(e) {
            if (e) e.preventDefault();
            hideAlert();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('signInSubmitBtn');
            const btnText = document.getElementById('signInBtnText');
            const spinner = document.getElementById('signInSpinner');

            if (!username || !password) {
                showAlert('Please enter both username and password.');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            spinner.classList.remove('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to sign in. Please verify your credentials.');
                }

                // Store token and user information
                localStorage.setItem('carewise_token', data.access_token);
                localStorage.setItem('carewise_user', JSON.stringify(data.user));

                showAlert('Signed in successfully! Redirecting...', true);
                
                setTimeout(() => {
                    const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '/';
                    window.location.href = redirectUrl;
                }, 400);

            } catch (err) {
                showAlert(err.message || 'An error occurred during sign in.');
                btn.disabled = false;
                btnText.textContent = 'Sign In to Dashboard';
                spinner.classList.add('hidden');
            }
        }

        async function handleRegister(e) {
            if (e) e.preventDefault();
            hideAlert();

            const fullName = document.getElementById('regFullName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const role = document.getElementById('regRole').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please re-check.');
                return;
            }

            const btn = document.getElementById('registerSubmitBtn');
            const btnText = document.getElementById('regBtnText');
            const spinner = document.getElementById('regSpinner');

            btn.disabled = true;
            btnText.textContent = 'Creating Account...';
            spinner.classList.remove('hidden');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: fullName,
                        username: username,
                        email: email || null,
                        role: role,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Registration failed. Please check your details.');
                }

                // Reset registration form
                document.getElementById('registerForm').reset();
                btn.disabled = false;
                btnText.textContent = 'Create Account';
                spinner.classList.add('hidden');

                // Switch to Sign In tab and pre-fill username
                tabSignIn.click();
                document.getElementById('loginUsername').value = username;
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginPassword').focus();

                // Show success prompt
                showAlert('User created successfully! Please sign in with your username/email and password to proceed.', true);

            } catch (err) {
                showAlert(err.message || 'An error occurred during account creation.');
                btn.disabled = false;
                btnText.textContent = 'Create Account';
                spinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
